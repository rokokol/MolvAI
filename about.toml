# cargo-about: what THIRD-PARTY.md is built from
# The list of accepted licenses stays in step with deny.toml:
# there it is the gate, here it is the filter of the report

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "OpenSSL",
    "Unlicense",            # whisper-rs, memchr: public domain
    "MIT-0",
    "CDLA-Permissive-2.0",  # Mozilla root certificates in webpki-roots: data
]

# The report covers what really enters the binary, not the dev dependencies
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false

# Target platforms: licenses depend on what the platform builds at all
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

workarounds = ["ring"]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22" role="img" aria-label="MolvAI">
  <!-- The mark is drawn on a 22-unit grid and shown at 22 px, so one unit is one pixel and
       every cell lands on a whole one. Each fill is a DDLC palette role: yuri-shadow for the
       plate, pink for the strip, dot for the bubble, paper for the highlight and yuri for the
       waveform -->
  <g shape-rendering="crispEdges">
    <rect width="22" height="22" fill="#361B39"/>
    <rect width="22" height="2" fill="#DD77BB"/>
    <rect x="3" y="4" width="16" height="12" fill="#FFDBF0"/>
    <rect x="2" y="5" width="18" height="10" fill="#FFDBF0"/>
    <rect x="3" y="5" width="16" height="1" fill="#FFFFFF"/>
    <rect x="5" y="16" width="6" height="1" fill="#FFDBF0"/>
    <rect x="6" y="17" width="4" height="1" fill="#FFDBF0"/>
    <rect x="7" y="18" width="2" height="1" fill="#FFDBF0"/>
    <g fill="#6C4681">
      <rect x="4" y="8" width="2" height="4"/>
      <rect x="7" y="6" width="2" height="8"/>
      <rect x="10" y="6" width="2" height="9"/>
      <rect x="13" y="7" width="2" height="6"/>
      <rect x="16" y="8" width="2" height="3"/>
    </g>
  </g>
</svg>

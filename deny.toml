# cargo-deny: лицензии зависимостей, уязвимости, источники.
# Проект под MIT, копилефт-зависимости запрещены (критерии Z-07, Z-08, Z-10).

[graph]
all-features = false

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    # Набор корневых сертификатов Mozilla (webpki-root-certs) — данные, а не код;
    # лицензия разрешительная и без копилефта, поэтому Z-07/Z-08 не нарушает.
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "0BSD",
    "OpenSSL",
    "Unlicense",   # whisper-rs и whisper-rs-sys: общественное достояние, OSI-approved
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Крейты workspace ссылаются друг на друга по path без версии — это не wildcard из реестра
allow-wildcard-paths = true

[advisories]
yanked = "deny"
# Tauri 2 на Linux тянет gtk-rs 0.18 (GTK3), proc-macro-error и unic-*, объявленные
# unmaintained; заменить их не в нашей власти, поэтому статус unmaintained проверяется
# только у прямых зависимостей workspace. Уязвимости остаются ошибкой при любой глубине.
unmaintained = "workspace"
ignore = [
    # glib 0.18 (через Tauri 2 / GTK3): unsound в VariantStrIter, который мы не вызываем;
    # исправлено в glib ≥ 0.20, куда Tauri перейдёт вместе с GTK4
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18 приходит транзитивно из Tauri 2; VariantStrIter не используется" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# cargo-deny: лицензии зависимостей, уязвимости, источники.
# Проект под MIT, копилефт-зависимости запрещены (критерии Z-07, Z-08, Z-10).

[graph]
all-features = false

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "OpenSSL",
    "Unlicense",   # whisper-rs и whisper-rs-sys: общественное достояние, OSI-approved
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Крейты workspace ссылаются друг на друга по path без версии — это не wildcard из реестра
allow-wildcard-paths = true

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# cargo-deny: dependency licenses, vulnerabilities, sources
# The project is under MIT, and copyleft dependencies are forbidden (criteria Z-07, Z-08, Z-10)

[graph]
all-features = false

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    # The Mozilla root certificate set (webpki-root-certs) is data, not code.
    # The license is permissive and has no copyleft, so it does not break Z-07/Z-08
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "0BSD",
    "OpenSSL",
    "Unlicense",   # whisper-rs and whisper-rs-sys: public domain, OSI-approved
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates refer to each other by path without a version: this is not a registry wildcard
allow-wildcard-paths = true

[advisories]
yanked = "deny"
# On Linux, Tauri 2 pulls in gtk-rs 0.18 (GTK3), proc-macro-error and unic-*, which are
# declared unmaintained. We cannot replace them, so the unmaintained status is checked
# only for the direct dependencies of the workspace. A vulnerability stays an error at any depth.
unmaintained = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

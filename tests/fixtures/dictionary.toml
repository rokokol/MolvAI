# An example of the MolvAI term dictionary
#
# `word` is how the term must look in the text. `aliases` is how the recognizer hears it,
# including case forms and multi-word variants. `case` = keep | upper | lower

[[term]]
word = "MolvAI"
aliases = ["молва", "молвы", "молве", "molvai", "молв ай"]
case = "keep"

[[term]]
word = "Hyprland"
aliases = ["гипрланд", "гипрланде", "хипрленд", "хайперленд"]
case = "keep"

[[term]]
word = "whisper.cpp"
aliases = ["виспер цпп", "виспер си пи пи", "whisper cpp"]
case = "keep"

[[term]]
word = "getUserById"
aliases = ["гет юзер бай айди", "гетюзербайайди"]
case = "keep"

[[term]]
word = "API"
aliases = ["апи", "эй пи ай"]
case = "upper"

[[term]]
word = "Пётр Иванов"
aliases = ["петр иванов", "пётр иванов", "петя иванов"]
case = "keep"

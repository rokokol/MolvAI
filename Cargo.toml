[workspace]
resolver = "2"
members = ["crates/molva-core", "crates/molva", "crates/molva-gui"]

[workspace.package]
# The single source of the version: the CLI (`molva --version`), the GUI packages (tauri.conf.json
# does not set a version and takes it from here) and the release tag `v<version>`. release.yml
# compares them before the build
version = "0.1.9"
edition = "2021"
license = "MIT"
repository = "https://github.com/rokokol/MolvAI"
rust-version = "1.85"
authors = ["rokokol"]

# One set of rules for all crates: each crate connects it with `[lints] workspace = true`.
# The `just clippy` gate runs the linter with `-D warnings`, so "warn" here means "the build
# fails". The level "allow" is only for pedantic rules about taste, not about quality
[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# We do not enable `nursery`: it has too many unfinished rules, and the gate would turn into noise

# Emergency exits in the product code: an error must be a value, not a panic.
# In `#[cfg(test)]` these rules are lifted through `cfg_attr` in the root of each crate
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Data goes to stdout, everything else goes to stderr. Printing data is allowed case by case with
# `#[allow(clippy::print_stdout)]` on the command module; stderr is not limited
print_stdout = "warn"
print_stderr = "allow"

# Pedantic rules about taste, not about quality: we lift them all at once, so as not to spread
# two dozen `#[allow]` over the code. The complexity limits are in `clippy.toml` next to this file
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
doc_markdown = "allow"
# `push_str(&format!(…))` against `write!`: the rule is about an extra allocation, and it suggests
# `write!` instead, whose `Result` cannot be an error for `String`. To silence it we would need
# `let _ =` in two dozen places (`unwrap` is forbidden above). This is worse than
# one allocation per report line
format_push_string = "allow"
# Casts between number sizes: audio is f32 from i16 and back, and the limits are
# checked in the code, not by the type
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
toml = "1"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
strsim = "0.11"
tempfile = "3"
# Track F: IPC, paste, hotkeys, notifications
interprocess = "2.4"
which = "8"
arboard = "3.6"
enigo = "0.6"
evdev = "0.13"
notify-rust = "4.18"

# Track E: file decoding, weight download, CLI
symphonia = { version = "0.6", default-features = false, features = [
    "mp3",
    "vorbis",
    "ogg",
    "flac",
    "isomp4",
    "aac",
    "wav",
    "pcm",
] }
hound = "3.5"
# Without default-tls: TLS only through rustls. The trusted roots come from rustls-platform-verifier:
# the system store, and where there is none, the Mozilla set from webpki-root-certs. One client
# for the weight download (blocking) and for the LLM (json)
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "http2",
    "charset",
    "rustls",
    "webpki-roots",
    "system-proxy",
] }
sha2 = "0.11"
# Encryption of the journal texts by the journal.encrypt setting (AEAD, RustCrypto, MIT/Apache-2.0)
chacha20poly1305 = "0.11"
# The OS key store: Secret Service (Linux, pure Rust through zbus, without libdbus),
# Credential Manager (Windows), Keychain (macOS). The license is MIT/Apache-2.0
keyring = { version = "3", default-features = false, features = [
    "async-secret-service",
    "async-io",
    "crypto-rust",
    "windows-native",
    "apple-native",
] }
indicatif = "0.18"
clap_complete = "4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace]
resolver = "2"
members = ["crates/molva-core", "crates/molva", "crates/molva-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/rokokol/MolvAI"
rust-version = "1.85"
authors = ["rokokol"]

# Единый набор правил для всех крейтов: каждый подключает его через `[lints] workspace = true`.
# Гейт `just clippy` запускает линтер с `-D warnings`, поэтому «warn» здесь означает «сборка
# падает». Уровень «allow» стоит только у педантичных правил про вкус, а не про качество.
[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
toml = "1"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
strsim = "0.11"
tempfile = "3"
# Дорожка F: IPC, вставка, горячие клавиши, уведомления
interprocess = "2.4"
which = "8"
arboard = "3.6"
enigo = "0.6"
evdev = "0.13"
notify-rust = "4.18"

# Дорожка E: декодирование файлов, загрузка весов, CLI
symphonia = { version = "0.5", default-features = false, features = [
    "mp3",
    "vorbis",
    "ogg",
    "flac",
    "isomp4",
    "aac",
    "wav",
    "pcm",
] }
hound = "3.5"
# Без default-tls: TLS только через rustls; доверенные корни берёт rustls-platform-verifier —
# системное хранилище, а где его нет, набор Mozilla из webpki-root-certs. Один клиент на
# загрузку весов (blocking) и на LLM (json).
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "http2",
    "charset",
    "rustls",
    "webpki-roots",
    "system-proxy",
] }
sha2 = "0.10"
indicatif = "0.18"
clap_complete = "4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace]
resolver = "2"
members = ["crates/molva-core", "crates/molva"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/rokokol/MolvAI"
rust-version = "1.85"
authors = ["rokokol"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
toml = "1"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
strsim = "0.11"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# rustfmt settings. The gate checks formatting: `just fmt` = `cargo fmt --all -- --check`,
# and CI runs the same step on three operating systems. The values are standard on purpose:
# there is no time to argue about style, and the file exists so that the style is fixed
# explicitly and does not depend on the defaults of the current version
edition = "2021"
max_width = 100
newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true

# The set for `molva bench`. The audio paths are relative to this directory
#
# The cases below use the speech fixtures of the repository. It is easier to put your own
# recordings next to this file, in `bench/audio/`, and to refer to them as `audio/name.wav`
# (see README.md)

[[case]]
id = "ru-short-phrase"
audio = "../tests/fixtures/privet_ru.wav"
reference = "Привет, как дела, Солнышко?"
language = "ru"

[[case]]
id = "en-short-phrase"
audio = "../tests/fixtures/hello_en.wav"
reference = "What's up, guys! How is it doing? It is cold today"
language = "en"

# Mixed speech: Russian with English inserts. It checks that the model does not "translate"
# and does not lose the foreign words
[[case]]
id = "ru-en-mixed"
audio = "../tests/fixtures/secret_ru_en.wav"
reference = "Hello, это очень very мега секретная информация"
language = "ru"

# Silence: the reference is empty, so any "transcript" here is a hallucination, and WER = 1
[[case]]
id = "silence-no-speech"
audio = "silence.wav"
reference = ""
language = "ru"

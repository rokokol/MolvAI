# Pins move by a pull request, not by surprise: dependabot watches the action versions in uses:,
# the crates in Cargo.lock and the interface packages, among them the Tauri CLI that
# builds the release packages. A bump reaches main only through the green gate of
# build.yml, because a pull request is checked by the same workflow as everything else
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Moscow
    commit-message:
      prefix: "ci"
    labels: ["dependencies"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Moscow
    commit-message:
      prefix: "build"
    labels: ["dependencies"]
    # Crate patches arrive in batches, and it is impossible to read one pull request for each
    groups:
      patch-updates:
        update-types: ["patch"]

  - package-ecosystem: npm
    directory: /crates/molva-gui/ui
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Moscow
    commit-message:
      prefix: "build"
    labels: ["dependencies"]
    groups:
      patch-updates:
        update-types: ["patch"]

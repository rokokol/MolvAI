name: pages

# The static site in site/ is published on every push to main and by hand from the
# Actions tab. docs/img is copied into the artifact next to the site, so a screenshot
# can be shown by a relative path without a second binary copy in the repository
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publication at a time and in order: a newer run waits for the running one, so an
# older deploy can never overwrite a newer one. Cancelling a deploy halfway is worse
# than waiting
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          mkdir -p _site/docs
          # A checkout may carry site/docs/img as a symlink to the real folder; the artifact
          # needs a real directory, so the link is replaced before the copy
          rm -rf _site/docs/img
          cp -R docs/img _site/docs/img

      # The version lives in Cargo.toml alone: the status page carries a placeholder, and the
      # published copy is the one place the number is written. A release that bumps the manifest
      # needs no second edit
      - name: Write the version into the status page
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ -z "$version" ]; then
            echo "Cargo.toml has no version" >&2
            exit 1
          fi
          sed -i "s/__MOLVAI_VERSION__/$version/g" _site/docs/status.html
          if grep -q '__MOLVAI_VERSION__' _site/docs/status.html; then
            echo "the status page still holds a placeholder" >&2
            exit 1
          fi
          grep -o "v$version" _site/docs/status.html | head -n 1

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

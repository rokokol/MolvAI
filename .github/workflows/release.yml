name: release

# The only workflow with the right to write to the repository: it and only it creates a release.
# It runs on a tag vX.Y.Z, and a manual run is a rehearsal without publication
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag is not released until the gate has passed. The job calls the real workflow, not a
  # copy of its steps: a copy drifts from the original
  gate:
    uses: ./.github/workflows/build.yml

  # The bill of materials and the license report are built once and put
  # into the release next to the binaries
  provenance:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-cyclonedx,cargo-about

      - name: just sbom
        run: just sbom

      - name: just third-party
        run: just third-party

      - uses: actions/upload-artifact@v7
        with:
          name: provenance
          path: |
            sbom/
            THIRD-PARTY.md
            NOTICE
            docs/model-licenses.md

  # The molva CLI on three operating systems; the binary also becomes the sidecar for the GUI
  cli:
    needs: gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported LTS: the binary needs a glibc no newer than the one it is
          # built on. On ubuntu-24.04 this is 2.39, and the appimage.github.io catalog, which
          # checks the AppImage on ubuntu-22.04, rejected an image with GLIBC_2.39 not found.
          # Vulkan runs whisper on a video card of any vendor, and without a Vulkan
          # device whisper.cpp falls back to the processor by itself
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: molva-core/vulkan
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: molva-core/vulkan
          - os: macos-latest
            target: aarch64-apple-darwin
            features: ""
    steps:
      - uses: actions/checkout@v7

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libxkbcommon-dev libwayland-dev \
            cmake patchelf squashfs-tools libvulkan-dev libclang-dev zsync

      # The ggml-vulkan shaders are compiled by glslc from the Vulkan SDK: Ubuntu 22.04 has no
      # glslc package
      - uses: jakoch/install-vulkan-sdk-action@v1.8.1
        if: contains(matrix.features, 'vulkan')
        with:
          vulkan_version: 1.4.363.0

      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      # The ready bindings of whisper-rs match the ABI of macOS, but they have no
      # ggml_backend_vk_* functions: for a Vulkan build, libclang generates the bindings.
      # On Windows the layout of structures is different, and the bindings are always
      # generated there
      - name: whisper-rs bindings from the crate (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "WHISPER_DONT_GENERATE_BINDINGS=1" >> "$GITHUB_ENV"

      - name: libclang for generating the whisper-rs bindings (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: printf 'LIBCLANG_PATH=%s\n' 'C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

      # The release for x86_64 is built for the portable x86-64-v3 (AVX2/FMA/F16C), not for the
      # processor of the runner. Otherwise the binary either crashes on another machine, or
      # without SIMD is 20 times slower
      - name: whisper.cpp SIMD for x86_64
        if: runner.arch == 'X64'
        shell: bash
        run: |
          {
            echo "GGML_NATIVE=OFF"
            echo "GGML_AVX=ON"
            echo "GGML_AVX2=ON"
            echo "GGML_FMA=ON"
            echo "GGML_F16C=ON"
          } >> "$GITHUB_ENV"

      # The runner image is in the key. A build script built on a newer image does not run on
      # an older one, because of the glibc version
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}-${{ matrix.target }}

      # One version for everything: the tag v<version> must match [workspace.package] version.
      # Otherwise the CLI and the GUI packages come out under the old number, as happened with
      # v0.1.1 and v0.1.2.
      # A manual run goes from a branch, not from a tag: there is nothing to compare with, and
      # nothing is published
      - name: The tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(cargo pkgid -p molva | sed 's/.*[#@]//')"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match version $version in Cargo.toml"
            exit 1
          fi

      # On Windows, ggml-vulkan builds the shader generator as a nested CMake project deep
      # inside the build directory, and the path goes over 260 characters. cl.exe fails with C1083
      # A short directory and a build without --target (the target equals the host) give a margin.
      # The steps below take the path to the binary from CLI_OUT
      - name: Build the CLI
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          args=(--locked --release --bin molva)
          if [ -n "$FEATURES" ]; then
            args+=(--features "$FEATURES")
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            export CARGO_TARGET_DIR=C:/t
            out=C:/t/release
          else
            args+=(--target "${{ matrix.target }}")
            out="target/${{ matrix.target }}/release"
          fi
          cargo build "${args[@]}"
          echo "CLI_OUT=$out" >> "$GITHUB_ENV"

      # Tauri expects a sidecar with a name that ends with the target triple
      - name: The binary as a sidecar for the GUI
        shell: bash
        run: |
          mkdir -p crates/molva-gui/binaries
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$CLI_OUT/molva.exe" "crates/molva-gui/binaries/molva-${{ matrix.target }}.exe"
          else
            cp "$CLI_OUT/molva" "crates/molva-gui/binaries/molva-${{ matrix.target }}"
          fi

      - name: CLI archive
        shell: bash
        run: |
          mkdir -p dist
          stage="molva-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$stage"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$CLI_OUT/molva.exe" "$stage/"
          else
            cp "$CLI_OUT/molva" "$stage/"
          fi
          cp README.md LICENSE NOTICE THIRD-PARTY.md "$stage/"
          tar -czf "dist/$stage.tar.gz" "$stage"

      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: dist/*

      # The GUI appears in track B; until tauri.conf.json exists, the step is skipped
      - name: Is there a Tauri config
        id: tauri
        shell: bash
        run: |
          if [ -f crates/molva-gui/tauri.conf.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SKIP: crates/molva-gui/tauri.conf.json does not exist yet, the GUI packages are not built"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.tauri.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/molva-gui/ui/package-lock.json

      # tauri-action runs only beforeBuildCommand (the frontend build), and it does not install
      # the npm dependencies. Without this step TypeScript does not find react, and the build fails
      - name: Frontend dependencies
        if: steps.tauri.outputs.present == 'true'
        working-directory: crates/molva-gui/ui
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        if: steps.tauri.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/molva-gui
          # The sidecar is declared by a separate config only for the release: the main
          # tauri.conf.json does not have it. Otherwise the CI gate would fail on the missing
          # file binaries/molva-<triple>, which appears only after the CLI build above.
          # Without the sidecar the installer puts one MolvAI.exe, and the GUI does not find molva
          args: --target ${{ matrix.target }} --config tauri.sidecar.conf.json
          # The CLI comes from package-lock.json of the interface, not from the registry.
          # Without tauriScript the action does not see it in projectPath, and it installs a
          # fresh @tauri-apps/cli@v2 on every run.
          # The path is counted from projectPath, and node exists on the runners of all three
          # operating systems
          tauriScript: node ui/node_modules/@tauri-apps/cli/tauri.js

      # The bundler before 2.12 built an AppImage that firejail and the appimage.github.io test
      # could not run: https://github.com/tauri-apps/tauri/issues/16155
      - name: Any user can run the AppImage
        if: steps.tauri.outputs.present == 'true' && runner.os == 'Linux'
        shell: bash
        run: scripts/check-appimage.sh target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

      # AppImageUpdate reads .upd_info from the image and the .zsync index next to it. The
      # Tauri bundler writes neither, so both are added before the artifact is uploaded
      - name: AppImage updates itself
        if: steps.tauri.outputs.present == 'true' && runner.os == 'Linux'
        shell: bash
        run: scripts/appimage-update-info.sh target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

      - uses: actions/upload-artifact@v7
        if: steps.tauri.outputs.present == 'true'
        with:
          name: gui-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.AppImage.zsync
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*setup.exe
            target/${{ matrix.target }}/release/bundle/**/*.dmg
          if-no-files-found: ignore

  # A CUDA build of the CLI for Windows: optional, and the release does not fail when it fails
  # (continue-on-error). The artifact pulls in the proprietary NVIDIA runtime (cudart, cublas),
  # so it goes in a separate archive with the suffix cuda. The free packages stay without it.
  # The runner is windows-2022, not windows-latest. CUDA 12.6 knows Visual Studio only up to
  # 2022, and with VS 2026 cudafe++ fails even with -allow-unsupported-compiler. Checked in
  # cuda.yml
  cli-cuda:
    needs: gate
    runs-on: windows-2022
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.6.0"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'

      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: rustup show

      - name: libclang for generating the whisper-rs bindings
        shell: bash
        run: printf 'LIBCLANG_PATH=%s\n' 'C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

      # The network installer of CUDA does not register its toolset in MSBuild, and the Visual
      # Studio generator fails with "No CUDA toolset found". Ninja with cl.exe from the developer
      # environment bypasses MSBuild completely: nvcc and cl are found through PATH
      - uses: ilammy/msvc-dev-cmd@v1

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-cuda-x86_64-pc-windows-msvc

      # Not bash: in the PATH of the Git shell, the coreutils `link.exe` from /usr/bin is first.
      # rustc linked with it instead of the MSVC linker. PowerShell keeps the PATH from
      # msvc-dev-cmd
      # The runner has a Visual Studio newer than CUDA 12.6 knows (2017–2022): nvcc refuses
      # without the flag -allow-unsupported-compiler. It is read from NVCC_APPEND_FLAGS and
      # CUDAFLAGS
      - name: Build the CLI with CUDA
        shell: pwsh
        env:
          CMAKE_GENERATOR: Ninja
          NVCC_APPEND_FLAGS: -allow-unsupported-compiler
          CUDAFLAGS: -allow-unsupported-compiler
        run: cargo build --locked --release --bin molva --features molva-core/cuda

      - name: Archive of the CLI with CUDA and the NVIDIA runtime
        shell: bash
        run: |
          mkdir -p dist
          stage="molva-cuda-${{ github.ref_name }}-x86_64-pc-windows-msvc"
          mkdir -p "$stage"
          cp target/release/molva.exe "$stage/"
          for dll in cudart64_12.dll cublas64_12.dll cublasLt64_12.dll; do
            cp "$CUDA_PATH/bin/$dll" "$stage/" || echo "::warning::no $dll in $CUDA_PATH/bin"
          done
          cp README.md LICENSE NOTICE THIRD-PARTY.md "$stage/"
          tar -czf "dist/$stage.tar.gz" "$stage"

      - uses: actions/upload-artifact@v7
        with:
          name: cli-cuda-x86_64-pc-windows-msvc
          path: dist/*

  # A CUDA build of the CLI for Linux: the same optional artifact as the Windows one. The
  # runner has no NVIDIA driver, so the build links against the toolkit stubs; at run time the
  # user's driver is used. The archive carries the CUDA runtime libraries and an rpath relative
  # to the binary. The free packages stay on Vulkan/CPU
  cli-cuda-linux:
    needs: gate
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.6.0"
          method: network
          sub-packages: '["nvcc", "cudart"]'

      - name: cuBLAS libraries
        run: |
          sudo apt-get install -y libcublas-12-6 libcublas-dev-12-6

      - name: System dependencies (Linux CUDA)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libclang-dev libssl-dev cmake patchelf \
            libasound2-dev libxkbcommon-dev libwayland-dev

      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-cuda-x86_64-unknown-linux-gnu

      - name: Build the CLI with CUDA
        shell: bash
        env:
          LIBCLANG_PATH: /usr/lib/llvm-14/lib
          LIBRARY_PATH: /usr/local/cuda/lib64/stubs
        run: cargo build --locked --release --bin molva --features molva-core/cuda

      - name: Archive of the CLI with CUDA and the NVIDIA runtime
        shell: bash
        run: |
          mkdir -p dist
          stage="molva-cuda-${{ github.ref_name }}-x86_64-unknown-linux-gnu"
          mkdir -p "$stage/lib"
          cp target/release/molva "$stage/"
          for lib in libcudart.so.12 libcublas.so.12 libcublasLt.so.12; do
            cp -L "/usr/local/cuda/lib64/$lib" "$stage/lib/" || echo "::warning::no $lib in /usr/local/cuda/lib64"
          done
          patchelf --set-rpath "\$ORIGIN/lib" "$stage/molva"
          cp README.md LICENSE NOTICE THIRD-PARTY.md "$stage/"
          tar -czf "dist/$stage.tar.gz" "$stage"

      - uses: actions/upload-artifact@v7
        with:
          name: cli-cuda-x86_64-unknown-linux-gnu
          path: dist/*

  publish:
    needs: [cli, cli-cuda, cli-cuda-linux, provenance]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The right to write is given to exactly one job in the whole repository
    permissions:
      contents: write
    steps:
      # The notes are the changelog section of this version, so the job needs the file
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: staging

      - name: Lay out the artifacts and compute the sums
        run: |
          mkdir -p dist
          find staging -type f ! -name '*.txt' -exec cp {} dist/ \;
          cd dist
          sha256sum ./* > sha256sums.txt
          cat sha256sums.txt

      # The release page resolves a relative link under /releases/tag/, where it leads
      # nowhere, so every link in the section points at the tree of this tag instead
      - name: Take the notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/notes.md"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          sed -E "s|\]\((\\./)?([^):]+)(#[^)]*)?\)|](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/\\2\\3)|g" \
            "$notes" > "$notes.linked"
          mv "$notes.linked" "$notes"
          head -5 "$notes"

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/notes.md

name: release

# Единственный workflow с правом писать в репозиторий: он и только он создаёт релиз.
# Запускается по тегу vX.Y.Z, ручной запуск — для репетиции без публикации.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Тег не выпускается, пока гейт не сошёлся: вызываем настоящий workflow,
  # а не копию его шагов
  gate:
    uses: ./.github/workflows/ci.yml

  # Ведомость состава и отчёт по лицензиям собираются один раз и кладутся
  # в релиз рядом с бинарниками
  provenance:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Тулчейн Rust из rust-toolchain.toml
        run: rustup show

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-cyclonedx,cargo-about

      - name: just sbom
        run: just sbom

      - name: just third-party
        run: just third-party

      - uses: actions/upload-artifact@v4
        with:
          name: provenance
          path: |
            sbom/
            THIRD-PARTY.md
            NOTICE
            docs/model-licenses.md

  # CLI molva на трёх ОС; бинарник заодно становится sidecar для GUI
  cli:
    needs: gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Системные зависимости (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libxkbcommon-dev libwayland-dev \
            cmake patchelf

      - name: Тулчейн Rust из rust-toolchain.toml
        shell: bash
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      # Готовые биндинги whisper-rs совпадают по ABI с Linux и macOS; на Windows раскладка
      # структур другая, поэтому биндинги генерируются предустановленным LLVM
      - name: Биндинги whisper-rs из крейта (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: echo "WHISPER_DONT_GENERATE_BINDINGS=1" >> "$GITHUB_ENV"

      - name: libclang для генерации биндингов whisper-rs (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: printf 'LIBCLANG_PATH=%s\n' 'C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

      # Релиз для x86_64 собирается под переносимый x86-64-v3 (AVX2/FMA/F16C), а не под
      # процессор раннера: иначе бинарь либо падает на чужой машине, либо без SIMD медленнее в 20 раз
      - name: SIMD whisper.cpp для x86_64
        if: runner.arch == 'X64'
        shell: bash
        run: |
          {
            echo "GGML_NATIVE=OFF"
            echo "GGML_AVX=ON"
            echo "GGML_AVX2=ON"
            echo "GGML_FMA=ON"
            echo "GGML_F16C=ON"
          } >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # Версия одна на всё: тег v<версия> обязан совпадать с [workspace.package] version,
      # иначе CLI и пакеты GUI выйдут под старым номером, как случилось с v0.1.1 и v0.1.2
      - name: Тег совпадает с версией в Cargo.toml
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(cargo pkgid -p molva | sed 's/.*[#@]//')"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::тег $TAG не совпадает с версией $version в Cargo.toml"
            exit 1
          fi

      - name: Сборка CLI
        shell: bash
        run: cargo build --locked --release --target ${{ matrix.target }} --bin molva

      # Tauri ждёт sidecar с именем, оканчивающимся на target triple
      - name: Бинарник как sidecar для GUI
        shell: bash
        run: |
          mkdir -p crates/molva-gui/binaries
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/molva.exe" \
               "crates/molva-gui/binaries/molva-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/molva" \
               "crates/molva-gui/binaries/molva-${{ matrix.target }}"
          fi

      - name: Архив CLI
        shell: bash
        run: |
          mkdir -p dist
          stage="molva-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$stage"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/molva.exe" "$stage/"
          else
            cp "target/${{ matrix.target }}/release/molva" "$stage/"
          fi
          cp README.md LICENSE NOTICE THIRD-PARTY.md "$stage/"
          tar -czf "dist/$stage.tar.gz" "$stage"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/*

      # GUI появляется в дорожке B; до появления tauri.conf.json шаг пропускается
      - name: Есть ли конфиг Tauri
        id: tauri
        shell: bash
        run: |
          if [ -f crates/molva-gui/tauri.conf.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SKIP: crates/molva-gui/tauri.conf.json ещё нет, пакеты GUI не собираются"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.tauri.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/molva-gui/ui/package-lock.json

      # tauri-action запускает только beforeBuildCommand (сборку фронтенда), а зависимости
      # npm ставит не он: без этого шага TypeScript не находит react и сборка падает
      - name: Зависимости фронтенда
        if: steps.tauri.outputs.present == 'true'
        working-directory: crates/molva-gui/ui
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        if: steps.tauri.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/molva-gui
          # Сайдкар объявлен отдельным конфигом только для релиза: в основном
          # tauri.conf.json его нет, иначе гейт CI падал бы на отсутствующем файле
          # binaries/molva-<triple>, который появляется лишь после сборки CLI выше.
          # Без сайдкара установщик кладёт один MolvAI.exe, и GUI не находит molva.
          args: --target ${{ matrix.target }} --config tauri.sidecar.conf.json

      - uses: actions/upload-artifact@v4
        if: steps.tauri.outputs.present == 'true'
        with:
          name: gui-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*setup.exe
            target/${{ matrix.target }}/release/bundle/**/*.dmg
          if-no-files-found: ignore

  # CUDA-сборка CLI для Windows: опциональная, релиз при её сбое не падает
  # (continue-on-error). Артефакт тянет проприетарный рантайм NVIDIA (cudart, cublas),
  # поэтому идёт отдельным архивом с суффиксом cuda, а свободные пакеты остаются без него.
  cli-cuda:
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: "12.6.0"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'

      - name: Тулчейн Rust из rust-toolchain.toml
        shell: bash
        run: rustup show

      - name: libclang для генерации биндингов whisper-rs
        shell: bash
        run: printf 'LIBCLANG_PATH=%s\n' 'C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

      # Сетевой установщик CUDA не регистрирует свой toolset в MSBuild, и генератор Visual
      # Studio падает с «No CUDA toolset found». Ninja с cl.exe из окружения разработчика
      # обходит MSBuild вовсе: nvcc и cl находятся по PATH.
      - uses: ilammy/msvc-dev-cmd@v1

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-cuda-x86_64-pc-windows-msvc

      # Не bash: в PATH оболочки Git первым стоит coreutils-`link.exe` из /usr/bin, и rustc
      # линковал им вместо компоновщика MSVC. PowerShell сохраняет PATH от msvc-dev-cmd.
      # На раннере Visual Studio новее, чем знает CUDA 12.6 (2017–2022): nvcc отказывается
      # без флага -allow-unsupported-compiler. Он читается из NVCC_APPEND_FLAGS и CUDAFLAGS.
      - name: Сборка CLI с CUDA
        shell: pwsh
        env:
          CMAKE_GENERATOR: Ninja
          NVCC_APPEND_FLAGS: -allow-unsupported-compiler
          CUDAFLAGS: -allow-unsupported-compiler
        run: cargo build --locked --release --bin molva --features molva-core/cuda

      - name: Архив CLI с CUDA и рантаймом NVIDIA
        shell: bash
        run: |
          mkdir -p dist
          stage="molva-cuda-${{ github.ref_name }}-x86_64-pc-windows-msvc"
          mkdir -p "$stage"
          cp target/release/molva.exe "$stage/"
          for dll in cudart64_12.dll cublas64_12.dll cublasLt64_12.dll; do
            cp "$CUDA_PATH/bin/$dll" "$stage/" || echo "::warning::нет $dll в $CUDA_PATH/bin"
          done
          cp README.md LICENSE NOTICE THIRD-PARTY.md "$stage/"
          tar -czf "dist/$stage.tar.gz" "$stage"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-cuda-x86_64-pc-windows-msvc
          path: dist/*

  publish:
    needs: [cli, cli-cuda, provenance]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Право писать выдано ровно одному job во всём репозитории
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Разложить артефакты и посчитать суммы
        run: |
          mkdir -p dist
          find staging -type f ! -name '*.txt' -exec cp {} dist/ \;
          cd dist
          sha256sum ./* > sha256sums.txt
          cat sha256sums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

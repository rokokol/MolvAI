name: ci

# The gate: everything that depends only on the repository. The detectors of the world (licenses,
# vulnerabilities) live in deny.yml and do not run on a pull request
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Automation (a dependency bump, a release) checks a branch by calling this workflow,
  # not a copy of its commands, which would drift apart from the original
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # A fast status: the policy of the workflow files, it answers in seconds next to the long build
  lint:
    name: lint workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # An unpinned call from the registry changes the behavior of the job without a single change
      # in the repository. The tools come from lock files and pinned actions
      # Each vendored copy is byte-equal to its source: a copy that is edited here and not
      # at the source fails with the file name — see .github/vendor.lock
      - name: Vendored copies match the source byte for byte
        run: ./vendor-sync.sh check
      - name: CI tools come from lock files, not from the registry
        run: ./check-pins.sh

      - name: actionlint
        uses: raven-actions/actionlint@v2

      # The gate on three operating systems installs the toolchain directly and does not know nix, so the check
      # of Nix formatting lives here. `nix fmt` takes the formatter from the output of the flake,
      # that is, from the same lock file, and not from the registry
      - uses: cachix/install-nix-action@v31
      - name: nix fmt --ci (Nix here is as the formatter writes it)
        run: nix fmt -- --ci

  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # System libraries of Tauri 2, the tray, audio and the build of whisper.cpp
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libxkbcommon-dev libwayland-dev \
            cmake patchelf

      # The toolchain version lives in rust-toolchain.toml and nowhere else: rustup reads
      # exactly this file, so CI cannot build with a different version than the developer
      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup show
          rustup component add rustfmt clippy
          cargo --version

      # The ready bindings of whisper-rs match the ABI of Linux and macOS, and libclang is not needed there.
      # On Windows the layout of their structures is different (a static assert fails), so the bindings
      # are generated on the spot through LLVM, which is preinstalled on the runner
      - name: whisper-rs bindings from the crate (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: echo "WHISPER_DONT_GENERATE_BINDINGS=1" >> "$GITHUB_ENV"

      - name: libclang for generating the whisper-rs bindings (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: printf 'LIBCLANG_PATH=%s\n' 'C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

      # whisper.cpp is built not for the processor of the runner (-march=native), but for the portable
      # x86-64-v3: AVX2/FMA/F16C exist on any laptop newer than 2013, and without them
      # recognition is 20 times slower
      - name: whisper.cpp SIMD for x86_64
        if: runner.arch == 'X64'
        shell: bash
        run: |
          {
            echo "GGML_NATIVE=OFF"
            echo "GGML_AVX=ON"
            echo "GGML_AVX2=ON"
            echo "GGML_FMA=ON"
            echo "GGML_F16C=ON"
          } >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-machete

      # The GUI frontend appears in crates/molva-gui/ui; until then the step is skipped
      - uses: actions/setup-node@v7
        if: hashFiles('crates/molva-gui/ui/package.json') != ''
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/molva-gui/ui/package-lock.json

      - name: Build the GUI frontend
        if: hashFiles('crates/molva-gui/ui/package.json') != ''
        working-directory: crates/molva-gui/ui
        run: |
          npm ci
          npm run build

      # The steps of the gate are the same just recipes that the developer runs locally.
      # There are no copies of the commands in CI: one command drifts from the other within a week
      - name: rustfmt --check (just fmt, settings in rustfmt.toml)
        run: just fmt

      - name: clippy -D warnings (just clippy, pedantic from Cargo.toml)
        run: just clippy

      - name: cargo machete — unused dependencies (just lint-deps)
        run: just lint-deps

      - name: just doc
        run: just doc

      - name: just test
        run: just test

      - name: just spdx-check
        run: just spdx-check

      - name: just no-stubs
        run: just no-stubs

      # The logs of the harness are needed when the suite failed on someone else's machine
      - name: Test run logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.os }}
          path: .test-logs/
          if-no-files-found: ignore
          retention-days: 7

  # Coverage is a map, not a gate: an artifact that shows the unchecked places
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The whisper-rs bindings from the crate: on Linux libclang is not needed
      WHISPER_DONT_GENERATE_BINDINGS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: System dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libxkbcommon-dev libwayland-dev \
            cmake patchelf

      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup show
          rustup component add llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-llvm-cov

      - name: just cov
        run: just cov

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.lcov
          retention-days: 14

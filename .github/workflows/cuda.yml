name: cuda

# A CUDA build of the CLI for Windows by manual start: it is debugged here, without a tag and without a release
# When the build is stably green, the same steps live in the job cli-cuda in release.yml
#
# What is already found out on the GitHub runners:
# - the network installer of CUDA does not register the toolset in MSBuild → the Ninja generator;
# - in the bash from Git, the coreutils link.exe is first in PATH → the build step runs from PowerShell;
# - CUDA 12.6 does not know Visual Studio 2026 on windows-latest, and cudafe++ fails even with
#   -allow-unsupported-compiler → the windows-2022 runner with Visual Studio 2022

on:
  workflow_dispatch:
    inputs:
      cuda:
        description: CUDA Toolkit version
        default: "12.6.0"
        required: false

permissions:
  contents: read

jobs:
  cli-cuda:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: ${{ inputs.cuda }}
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'

      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: rustup show

      - name: libclang for generating the whisper-rs bindings
        shell: bash
        run: printf 'LIBCLANG_PATH=%s\n' 'C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: Swatinem/rust-cache@v2
        with:
          key: cuda-x86_64-pc-windows-msvc

      - name: Build the CLI with CUDA
        shell: pwsh
        env:
          CMAKE_GENERATOR: Ninja
          NVCC_APPEND_FLAGS: -allow-unsupported-compiler
          CUDAFLAGS: -allow-unsupported-compiler
        run: cargo build --locked --release --bin molva --features molva-core/cuda

      - name: Archive of the CLI with CUDA and the NVIDIA runtime
        shell: bash
        run: |
          mkdir -p dist
          stage="molva-cuda-$(cargo pkgid -p molva | sed 's/.*[#@]//')-x86_64-pc-windows-msvc"
          mkdir -p "$stage"
          cp target/release/molva.exe "$stage/"
          for dll in cudart64_12.dll cublas64_12.dll cublasLt64_12.dll; do
            cp "$CUDA_PATH/bin/$dll" "$stage/" || echo "::warning::no $dll in $CUDA_PATH/bin"
          done
          cp README.md LICENSE NOTICE THIRD-PARTY.md "$stage/"
          tar -czf "dist/$stage.tar.gz" "$stage"

      - uses: actions/upload-artifact@v7
        with:
          name: cli-cuda-x86_64-pc-windows-msvc
          path: dist/*

name: deny

# A detector, not a gate: a red run here blames the world (a new CVE in the RustSec database,
# a changed license of a dependency), not someone's pull request. So it runs
# on a push to main, once a week and by hand, but never on a pull request
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deny-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Advisories from the RustSec database, dependency licenses, banned crates, sources: the
  # rules are in deny.toml. The database grows without a single commit to the repository
  licenses:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

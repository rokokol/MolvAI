[package]
name = "molva-core"
description = "Ядро MolvAI: контракты, конвейер диктовки, журнал, статистика"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[features]
default = []
# Ускорители whisper.cpp: включаются на стороне пользователя, код одинаковый.
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]
metal = ["whisper-rs/metal"]
coreml = ["whisper-rs/coreml"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
toml = { workspace = true }
directories = { workspace = true }
tracing = { workspace = true }
# tracing_backend уводит логи whisper.cpp из stderr в tracing: в stdout только данные (Y-15).
whisper-rs = { version = "0.16", features = ["tracing_backend"] }
cpal = "0.18"
hound = "3.5"

[dev-dependencies]
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

[package]
name = "molva-core"
description = "MolvAI core: contracts, dictation pipeline, journal, statistics"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[features]
default = []
# whisper.cpp accelerators: the user turns them on, the code is the same
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]
metal = ["whisper-rs/metal"]
coreml = ["whisper-rs/coreml"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
toml = { workspace = true }
directories = { workspace = true }
strsim = { workspace = true }
tracing = { workspace = true }
# Capture and recognition. tracing_backend moves the whisper.cpp logs from stderr to tracing:
# stdout carries only data (Y-15)
whisper-rs = { version = "0.16", features = ["tracing_backend"] }
cpal = "0.18"
hound = { workspace = true }
# File decoding, model weight download
symphonia = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
chacha20poly1305 = { workspace = true }
keyring = { workspace = true }
# IPC, paste, tools
interprocess = { workspace = true }
which = { workspace = true }
arboard = { workspace = true }
enigo = { workspace = true }

# On Linux the clipboard and input synthesis support Wayland, plus evdev and notifications
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { workspace = true, features = ["wayland-data-control"] }
enigo = { workspace = true, features = ["wayland"] }
evdev = { workspace = true }
notify-rust = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
notify-rust = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true

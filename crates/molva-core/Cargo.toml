[package]
name = "molva-core"
description = "Ядро MolvAI: контракты, конвейер диктовки, журнал, статистика"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[features]
default = []
# Ускорители whisper.cpp: включаются на стороне пользователя, код одинаковый.
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]
metal = ["whisper-rs/metal"]
coreml = ["whisper-rs/coreml"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
toml = { workspace = true }
directories = { workspace = true }
tracing = { workspace = true }
# Захват и распознавание
whisper-rs = "0.16"
cpal = "0.18"
hound = { workspace = true }
# Декодирование файлов, загрузка весов
symphonia = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

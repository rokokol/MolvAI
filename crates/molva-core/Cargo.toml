[package]
name = "molva-core"
description = "Ядро MolvAI: контракты, конвейер диктовки, журнал, статистика"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[features]
default = []
# Ускорители whisper.cpp: включаются на стороне пользователя, код одинаковый.
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]
metal = ["whisper-rs/metal"]
coreml = ["whisper-rs/coreml"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
toml = { workspace = true }
directories = { workspace = true }
tracing = { workspace = true }
# Захват и распознавание. tracing_backend уводит логи whisper.cpp из stderr в tracing:
# в stdout только данные (Y-15).
whisper-rs = { version = "0.16", features = ["tracing_backend"] }
cpal = "0.18"
hound = { workspace = true }
# Декодирование файлов, загрузка весов
symphonia = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
# IPC, вставка, инструменты
interprocess = { workspace = true }
which = { workspace = true }
arboard = { workspace = true }
enigo = { workspace = true }

# На Linux буфер обмена и синтез ввода умеют Wayland, плюс evdev и уведомления.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { workspace = true, features = ["wayland-data-control"] }
enigo = { workspace = true, features = ["wayland"] }
evdev = { workspace = true }
notify-rust = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
notify-rust = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

[package]
name = "molva"
description = "MolvAI: системный голосовой ввод — CLI и демон"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
# Бинарь распространяется релизами, не через crates.io: path-зависимость на ядро без версии
publish = false

[[bin]]
name = "molva"
path = "src/main.rs"

[dependencies]
molva-core = { path = "../molva-core" }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }

[package]
name = "molva-gui"
description = "MolvAI GUI on Tauri 2: tray, settings, history and statistics"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
# Tauri bundles ship the application, not crates.io: a path dependency on the core has no version
publish = false

[lib]
# The library name has no hyphen: main.rs and the Tauri mobile glue import it
name = "molva_gui"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "molva-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
molva-core = { path = "../molva-core" }
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2.5"
interprocess = "2.4"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
directories = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sys-locale = "0.3.2"

# A second copy of the application shows the window of the first; mobile has no such plugin
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-single-instance = "2"

# On Wayland a process gets no global hotkeys: there the compositor sets the binds
[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2.3"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

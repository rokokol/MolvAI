# The one list of model weights: the CLI and the GUI read it at run time, and the flake
# reads it to fetch the weights into the Nix store. A size and a SHA-256 are checked before
# a file reaches the disk, so a mirror may serve it over plain HTTP.
#
# engine chooses the recognizer that can run the file. The model name is what
# `stt.model`, `molva models pull` and `programs.molvai.models` use.

[[model]]
name = "tiny"
file_name = "ggml-tiny.bin"
url = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin"

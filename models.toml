# The same weights and the same quantization that the agent on the station uses for
# Russian speech. The revision is pinned: a re-upload upstream must not change what a
# hash in this file means. The hash below was checked against the LFS oid that the Hugging
# Face API reports for this revision, not copied from a local download.
